<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="common/css/common.css" />
    <link rel="stylesheet" href="common/css/type-scale.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet" />
  </head>
  <body class="page">
    <!--▼==================== ヘッダー開始 ====================▼-->
    <header class="header">
      <img class="header__logo" src="common/images/logo.png" alt="ロゴ" />
      <img class="header__menu" src="common/images/menu-icon.svg" alt="メニューアコン" />
    </header>
    <!--▲==================== ヘッダー終了 ====================▲-->

    <!--▼==================== メイン開始 ====================▼-->
    <main class="main">
      <section class="heroSection">
        <img class="heroSecion__img" src="images/main-visual.jpg" alt="メインビジュアル" />
        <img class="heroSecion__slogan" src="images/slogan.png" alt="スローガン" />
      </section>

      <section class="mainContents main__contents">
        <!--▼ 季節限定メニュー開始 ▼-->
        <section class="seasonalMenu content">
          <h2 class="content__title">季<span class="content__title--accent">節</span>限定メニュー</h2>
          <div class="seasonalMenu__collection">
            <div class="seasonalMenuItem">
              <h3 class="text-l">夏色フォカッチャ</h3>
              <p class="text-r">
                彩り豊かな夏野菜をたっぷりのせた、<br />
                見た目も味も楽しいフォカッチャです
              </p>
              <img class="seasonalMenuItem__img" src="images/summer-focaccia.jpg" alt="夏色フォカッチャ" />
            </div>
            <div class="seasonalMenuItem">
              <h3 class="text-l">瀬戸内パウンド</h3>
              <p class="text-r">
                瀬戸内レモンの爽やかな香りと<br />ほどよい酸味が広がる、<br />夏にぴったりのパウンドケーキです
              </p>
              <img class="seasonalMenuItem__img" src="images/setouchi-pound-cake.jpg" alt="瀬戸内パウンド" />
            </div>
          </div>
          <a class="content__detailLink content__detailLink--hover" href="#">他のメニューを見る</a>
        </section>
        <!--▲ 季節限定メニュー終了 ▲-->

        <hr class="mainContents__separator" />

        <!--▼ こだわり開始 ▼-->
        <section class="concept content">
          <h2 class="content__title">こ<span class="content__title--accent">だ</span>わり</h2>
          <p class="concept__description text-m">
            北海道産「ゆめちから」を使った香り高い小麦の風味。<br />地元農家から届く採れたて野菜を贅沢に使用し、体にやさしい無添加のパンをひとつひとつ丁寧に焼き上げています。
          </p>
          <img class="concept__img" src="./images/concept.jpg" alt="コンセプト" />
          <a class="content__detailLink content__detailLink--hover" href="#">こだわりについてもっと詳しく</a>
        </section>
        <!--▲ こだわり終了 ▲-->
      </section>
    </main>
    <!--▲==================== メイン終了 ====================▲-->
  </body>
</html>
