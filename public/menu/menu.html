<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../common/css/common.css" />
    <link rel="stylesheet" href="../common/css/type-scale.css" />
    <link rel="stylesheet" href="menu.css" />
    <title>メニュー | Mocchii bakery</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&display=swap" rel="stylesheet" />
  </head>
  <body class="page">
    <!--▼==================== ヘッダー開始 ====================▼-->
    <header class="header">
      <img class="header__logo" src="../common/images/logo.png" alt="ロゴ" />
      <img class="header__menu" src="../common/images/menu-icon.svg" alt="メニューアコン" />
    </header>
    <!--▲==================== ヘッダー終了 ====================▲-->

    <!--▼==================== メイン開始 ====================▼-->
    <main class="main">
      <section class="eyecatch">
        <img class="eyecatch__img" src="images/eyecatch.jpg" alt="アイキャッチ" />
        <h1 class="eyecatch__title text-3xl">Menu</h1>
      </section>

      <section class="menu">
        <section class="menu__category">
          <h2 class="menu__title">季<span class="menu__title--accent">節</span>限定</h2>
          <div class="menu__list">
            <div class="menuItem">
              <img class="menuItem__img" src="images/setouchi-pound-cake.jpg" alt="瀬戸内パウンド" />
              <h3 class="menuItem__title">瀬戸内パウンド</h3>
            </div>
            <div class="menuItem">
              <img class="menuItem__img" src="images/summer-focaccia.jpg" alt="夏色フォカッチャ" />
              <h3 class="menuItem__title">夏色フォカッチャ</h3>
            </div>
          </div>
        </section>
        <hr class="menu__separator" />
      </section>
    </main>
    <!--▲==================== メイン終了 ====================▲-->

    <!--▼==================== フッター開始 ====================▼-->
    <footer class="footer">
      <section class="footerMain">
        <div class="footerMain__inner">
          <div class="footerMain__shopInfo">
            <img class="footerMain__logo" src="../common/images/logo-outline.png" alt="ロゴ" />
            <p class="text-r">静岡県浜松市浜名区八幡xxx-xx</p>
            <p class="text-r">TEL 03-4512-xxxx</p>
          </div>
          <nav class="footerMain__nav">
            <ul class="footerMain__navList">
              <li><a class="footerMain__navLink footerMain__navLink--hover" href="../index.html">ホーム</a></li>
              <li><a class="footerMain__navLink footerMain__navLink--hover" href="#">こだわり</a></li>
              <li><a class="footerMain__current">メニュー</a></li>
              <li><a class="footerMain__navLink footerMain__navLink--hover" href="news/news.html">お知らせ</a></li>
              <li><a class="footerMain__navLink footerMain__navLink--hover" href="#">店舗情報</a></li>
            </ul>
          </nav>
        </div>
      </section>
      <section class="copyright footer__copyright">
        <p class="copyright__text text-r">&copy; 2025 Mocchii bakery</p>
      </section>
    </footer>
    <!--▲==================== フッター終了 ====================▲-->
  </body>
</html>
