  <body class="page">

    <header class="header">
      <a href="../index.html"><img class="header__logo" src="../common/images/logo.png" alt="ロゴ" /></a>
      <button class="header__navBtn" onclick="document.querySelector('html').classList.toggle('open')">

          class="header__navBtnImg header__navBtnImg--open"

            <div class="menuItem">

        <hr class="menu__separator" />

        <section class="menu__category">
          <h2 class="menu__title">惣<span class="menu__title--accent">菜</span>パン</h2>
          <div class="menu__list">
            <div class="menuItem">
              <img class="menuItem__img" src="images/curry-bread.jpg" alt="カレーパン" />

            <div class="menuItem">
              <img class="menuItem__img" src="images/ratatouille-tartine.jpg" alt="ラタトゥイユのタルティーヌ" />
              <h3 class="menuItem__title">ラタトゥイユの<br />タルティーヌ</h3>
            </div>
          </div>
        </section>

        <hr class="menu__separator" />

        <section class="menu__category">
          <h2 class="menu__title">菓<span class="menu__title--accent">子</span>パン</h2>
          <div class="menu__list">
            <div class="menuItem">

            <div class="menuItem">

              <h3 class="menuItem__title">マリトッツォ</h3>

              <li><a class="footerMain__current">メニュー</a></li>
